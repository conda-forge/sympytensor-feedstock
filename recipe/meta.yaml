{% set name = "sympytensor" %}
{% set version = "2.2.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/sympytensor-{{ version }}.tar.gz
  sha256: eb1534b2a789bdf06a9d9f270a1fcc2b9d1a72958daba587bfe9ccc8a76504f5

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - numpy
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - pytensor >=2.37.0
    - sympy
    - pymc
    - mpmath >=1.1.0,<1.4.0

test:
  imports:
    - sympytensor
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/jessegrabowski/sympytensor
  summary: Print sympy expressions to pytensor graphs
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jessegrabowski
